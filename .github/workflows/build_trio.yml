name: 4. Build Trio
run-name: BLOCKED Build Trio (${{ github.ref_name }})

on:
  workflow_dispatch:

jobs:
  blocked:
    name: Dev builds are disabled
    runs-on: ubuntu-latest
    steps:
      - name: Stop non-main build
        run: |
          echo "::error::This Trio fork is locked to the stable main branch. Building or uploading the dev branch is disabled."
          echo "Use 4. Build Trio on the main branch."
          exit 1
