name: Copy browser-build secrets to xDrip

on:
  workflow_dispatch:

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy repository secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TEAMID_VALUE: ${{ secrets.TEAMID }}
          FASTLANE_ISSUER_ID_VALUE: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY_ID_VALUE: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_KEY_VALUE: ${{ secrets.FASTLANE_KEY }}
          GH_PAT_VALUE: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD_VALUE: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          target="deovolente1/xdripswift"
          printf '%s' "$TEAMID_VALUE" | gh secret set TEAMID --repo "$target"
          printf '%s' "$FASTLANE_ISSUER_ID_VALUE" | gh secret set FASTLANE_ISSUER_ID --repo "$target"
          printf '%s' "$FASTLANE_KEY_ID_VALUE" | gh secret set FASTLANE_KEY_ID --repo "$target"
          printf '%s' "$FASTLANE_KEY_VALUE" | gh secret set FASTLANE_KEY --repo "$target"
          printf '%s' "$GH_PAT_VALUE" | gh secret set GH_PAT --repo "$target"
          printf '%s' "$MATCH_PASSWORD_VALUE" | gh secret set MATCH_PASSWORD --repo "$target"
          echo "Copied 6 repository secrets to $target."
